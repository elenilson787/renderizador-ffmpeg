name: Renderizar Vídeo Longo (FFmpeg)

on:
  workflow_dispatch:
    inputs:
      nome_video:
        description: 'Nome do arquivo final (ex: meu_video)'
        required: true
        default: 'video_renderizado'

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v4

      - name: Instalar FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Criar pastas temporárias
        run: mkdir -p output temp_clips

      - name: Executar Renderização Inteligente
        run: |
          # 1. Localizar o áudio gerado pelo TTS no n8n
          AUDIO_FILE=$(find assets/ -type f \( -name "*.mp3" -o -name "*.wav" -o -name "*.m4a" \) | head -n 1)

          if [ -z "$AUDIO_FILE" ]; then
            echo "Erro: Áudio não encontrado na pasta assets!"
            exit 1
          fi

          # 2. Normalizar o áudio para evitar estalos
          ffmpeg -y -i "$AUDIO_FILE" -ar 44100 -ac 2 -b:a 192k temp_audio.mp3

          INDEX=0
          EFEITOS=("zoom_in" "zoom_out" "pan_right")

          # 3. Processar mídias enviadas pelo n8n em ordem sequencial
          find assets/ -type f \( -name "*.jpg" -o -name "*.jpeg" -o -name "*.png" -o -name "*.mp4" -o -name "*.mov" \) | sort | while read -r MEDIA; do
            INDEX=$((INDEX+1))
            OUT_CLIP="temp_clips/clip_$(printf "%03d" $INDEX).mp4"
            EXT="${MEDIA##*.}"
            EXT_LOWER=$(echo "$EXT" | tr '[:upper:]' '[:lower:]')

            echo "Processando mídia $INDEX: $MEDIA"

            if [[ "$EXT_LOWER" == "mp4" || "$EXT_LOWER" == "mov" ]]; then
              # VÍDEO: Padroniza para 1920x1080 @ 30fps (Horizontal)
              ffmpeg -y -i "$MEDIA" \
                -vf "scale=1920:1080:force_original_aspect_ratio=increase,crop=1920:1080,fps=30" \
                -c:v libx264 -preset fast -pix_fmt yuv420p -an "$OUT_CLIP"
            else
              # FOTO: Aplica animações dinâmicas (Zoom/Pan) em 1920x1080
              EFEITO_INDEX=$((INDEX % 3))
              EFEITO="${EFEITOS[$EFEITO_INDEX]}"

              if [ "$EFEITO" == "zoom_in" ]; then
                FILTER="scale=8000:-1,zoompan=z='min(zoom+0.0015,1.3)':x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':d=120:s=1920x1080:fps=30"
              elif [ "$EFEITO" == "zoom_out" ]; then
                FILTER="scale=8000:-1,zoompan=z='if(lte(zoom,1.0),1.3,max(1.001,zoom-0.0015))':x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':d=120:s=1920x1080:fps=30"
              else
                FILTER="scale=8000:-1,zoompan=z='1.2':x='if(gte(zoom,1.2),x+1.5,0)':y='ih/2-(ih/zoom/2)':d=120:s=1920x1080:fps=30"
              fi

              ffmpeg -y -loop 1 -i "$MEDIA" \
                -vf "$FILTER" \
                -t 4 -c:v libx264 -preset fast -pix_fmt yuv420p "$OUT_CLIP"
            fi
          done

          # 4. Criar lista de junção
          > concat_list.txt
          for f in temp_clips/clip_*.mp4; do
            echo "file '$f'" >> concat_list.txt
          done

          # 5. Loop do vídeo até cobrir todo o áudio da narração
          ffmpeg -y -f concat -safe 0 -stream_loop -1 -i concat_list.txt -c copy temp_video_loop.mp4

          NOME_PASTELA="${{ github.event.inputs.nome_video }}"
          NOME_LIMPO="${NOME_PASTELA%.mp4}"

          # 6. Renderizar versão final sincronizada com o áudio
          ffmpeg -y -i temp_video_loop.mp4 -i temp_audio.mp3 \
            -c:v copy -c:a copy -shortest "output/${NOME_LIMPO}.mp4"

      - name: Disponibilizar Vídeo para Download
        uses: actions/upload-artifact@v4
        with:
          name: video-renderizado
          path: output/*.mp4
          retention-days: 7
