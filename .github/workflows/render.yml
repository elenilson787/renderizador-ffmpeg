name: Renderizar Vídeo Longo (FFmpeg)

on:
  workflow_dispatch:
    inputs:
      nome_video:
        description: 'Nome do arquivo final (ex: meu_video)'
        required: true
        default: 'video_15min'

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v4

      - name: Instalar FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Criar pasta de saída
        run: mkdir -p output

      - name: Executar Renderização Inteligente
        run: |
          # 1. Encontrar a imagem na pasta assets
          IMAGE_FILE=$(find assets/ -type f \( -name "*.jpg" -o -name "*.jpeg" -o -name "*.png" \) | head -n 1)
          
          # 2. Encontrar o áudio na pasta assets
          AUDIO_FILE=$(find assets/ -type f \( -name "*.mp3" -o -name "*.m4a" -o -name "*.wav" \) | head -n 1)

          echo "----------------------------------------"
          echo "Imagem selecionada: $IMAGE_FILE"
          echo "Áudio selecionado: $AUDIO_FILE"
          echo "----------------------------------------"

          if [ -z "$IMAGE_FILE" ] || [ -z "$AUDIO_FILE" ]; then
            echo "Erro: Imagem ou Áudio não encontrados na pasta assets!"
            exit 1
          fi

          # 3. Normalizar áudio para MP3 limpo
          echo "Normalizando áudio..."
          ffmpeg -y -i "$AUDIO_FILE" -ar 44100 -ac 2 -b:a 192k temp_audio.mp3

          # 4. Tratar o nome do arquivo final
          NOME_PASTELA="${{ github.event.inputs.nome_video }}"
          NOME_LIMPO="${NOME_PASTELA%.mp4}"

          # 5. Renderizar forçando dimensões pares (-vf "crop=trunc(iw/2)*2:trunc(ih/2)*2")
          echo "Iniciando renderização do vídeo..."
          ffmpeg -y -loop 1 -i "$IMAGE_FILE" -i temp_audio.mp3 \
            -vf "crop=trunc(iw/2)*2:trunc(ih/2)*2" \
            -c:v libx264 -preset ultrafast -tune stillimage \
            -c:a copy \
            -pix_fmt yuv420p -shortest \
            "output/${NOME_LIMPO}.mp4"

      - name: Disponibilizar Vídeo para Download
        uses: actions/upload-artifact@v4
        with:
          name: video-renderizado
          path: output/*.mp4
          retention-days: 7
