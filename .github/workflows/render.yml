name: Renderizar Vídeo Longo (FFmpeg)

on:
  workflow_dispatch:
    inputs:
      nome_video:
        description: 'Nome do arquivo final (sem espaço)'
        required: true
        default: 'video_15min'

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v4

      - name: Instalar FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Criar pasta de saída
        run: mkdir -p output

      - name: Executar Renderização FFmpeg
        run: |
          echo "Buscando arquivos na pasta assets..."
          
          # Detecta automaticamente se o audio é mp3, m4a ou outro formato na pasta assets
          AUDIO_FILE=$(ls assets/áudio* assets/audio* 2>/dev/null | head -n 1)
          IMAGE_FILE=$(ls assets/fundo* 2>/dev/null | head -n 1)

          echo "Imagem encontrada: $IMAGE_FILE"
          echo "Áudio encontrado: $AUDIO_FILE"

          if [ -z "$AUDIO_FILE" ] || [ -z "$IMAGE_FILE" ]; then
            echo "Erro: Imagem ou Áudio não encontrados na pasta assets!"
            exit 1
          fi

          # Executa a renderização com compatibilidade universal de áudio/vídeo
          ffmpeg -y -loop 1 -i "$IMAGE_FILE" -i "$AUDIO_FILE" \
            -c:v libx264 -preset superfast -tune stillimage \
            -c:a aac -b:a 192k \
            -pix_fmt yuv420p -shortest \
            output/${{ github.event.inputs.nome_video }}.mp4

      - name: Disponibilizar Vídeo para Download
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.nome_video }}
          path: output/*.mp4
          retention-days: 7
